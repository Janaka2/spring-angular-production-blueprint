# kube-prometheus-stack: Prometheus, Alertmanager, Grafana, kube-state-metrics, node-exporter. Sized for one small node.
prometheus:
  prometheusSpec:
    retention: 3d
    resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { memory: 1Gi } }
    serviceMonitorSelectorNilUsesHelmValues: false   # pick up the assetcare ServiceMonitor
    ruleSelectorNilUsesHelmValues: false
alertmanager:
  alertmanagerSpec:
    resources: { requests: { cpu: 20m, memory: 64Mi } }
  # same routing as observability/alertmanager/alertmanager.yaml; put the webhook URL / SMTP password in a Secret and
  # reference it with alertmanagerSpec.secrets + *_file fields rather than pasting it here
  config:
    global: { resolve_timeout: 5m }
    route:
      receiver: webhook
      group_by: [alertname, service]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers: [severity="critical"]
          receiver: webhook
          repeat_interval: 1h
    receivers:
      - name: webhook
        webhook_configs: [{ url: https://ntfy.sh/CHANGE-ME-assetcare-alerts, send_resolved: true }]
    inhibit_rules:
      - source_matchers: [alertname="AssetCareApiDown"]
        target_matchers: [alertname=~"AssetCareHigh5xxRate|AssetCareP95LatencyHigh|AssetCareDependencyDown|AssetCareDbPoolNearlyExhausted"]
        equal: [service]
grafana:
  adminPassword: CHANGE-ME
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
  additionalDataSources:
    - { name: Loki, type: loki, uid: loki, url: http://loki-gateway.observability }
    - { name: Tempo, type: tempo, uid: tempo, url: http://tempo.observability:3200 }
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers: [{ name: assetcare, folder: AssetCare, type: file, options: { path: /var/lib/grafana/dashboards/assetcare } }]
  dashboardsConfigMaps: { assetcare: assetcare-dashboards }   # kubectl create configmap assetcare-dashboards --from-file=observability/grafana/dashboards/
# alert rules: create them from the same file the local profile uses
#   kubectl -n observability create configmap assetcare-rules --from-file=observability/prometheus/rules.yml   (or a PrometheusRule)
# The chart also creates a Probe (blackbox) for the public host when observability.enabled=true; install the exporter:
#   helm upgrade --install blackbox prometheus-community/prometheus-blackbox-exporter -n observability -f deploy/helm/observability/blackbox.yaml
additionalPrometheusRulesMap: {}
kubeEtcd: { enabled: false }     # K3s: no separate etcd
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
