{{- if not .Values.api.existingSecret }}
# DEVELOPMENT ONLY: created from values. In production set api.existingSecret and manage the secret in a vault
# (External Secrets Operator, OCI Vault). Kubernetes Secrets are base64, not encryption; enable encryption at rest.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "assetcare.component" (dict "root" . "component" "api") | nindent 4 }}
type: Opaque
stringData:
  ASSETCARE_DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  ASSETCARE_S3_ACCESS_KEY: {{ .Values.secrets.minioRootUser | quote }}
  ASSETCARE_S3_SECRET_KEY: {{ .Values.secrets.minioRootPassword | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.secrets.keycloakAdminPassword | quote }}
  MINIO_ROOT_USER: {{ .Values.secrets.minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minioRootPassword | quote }}
{{- end }}
