# Let's Encrypt issuers for cert-manager on K3s (Traefik solves the HTTP-01 challenge).
# Apply after cert-manager: kubectl apply -f deploy/k3s/cluster-issuer.yaml
# Use letsencrypt-staging first: it has generous rate limits and proves DNS and ingress work before the real issuer.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: CHANGE-ME@example.com
    privateKeySecretRef: { name: letsencrypt-staging-account }
    solvers:
      - http01:
          ingress: { class: traefik }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: CHANGE-ME@example.com
    privateKeySecretRef: { name: letsencrypt-prod-account }
    solvers:
      - http01:
          ingress: { class: traefik }
