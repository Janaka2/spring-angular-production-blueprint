databaseChangeLog:
  - changeSet:
      id: 002-asset
      author: janaka
      comment: The aggregate root. Archive is a status, not a delete (ADR-010). version is the optimistic lock.
      changes:
        - createTable:
            tableName: asset
            columns:
              - column: { name: id,             type: uuid,            constraints: { primaryKey: true, primaryKeyName: pk_asset } }
              - column: { name: name,           type: varchar(120),    constraints: { nullable: false } }
              - column: { name: description,    type: varchar(2000) }
              - column: { name: asset_tag,      type: varchar(60) }
              - column: { name: serial_number,  type: varchar(120) }
              - column: { name: category_id,    type: uuid,            constraints: { nullable: false, foreignKeyName: fk_asset_category, references: category(id) } }
              - column: { name: status,         type: varchar(20),     constraints: { nullable: false } }
              - column: { name: manufacturer,   type: varchar(120) }
              - column: { name: model,          type: varchar(120) }
              - column: { name: purchase_date,  type: date }
              - column: { name: purchase_price, type: "numeric(14,2)" }
              - column: { name: currency,       type: char(3) }
              - column: { name: warranty_until, type: date }
              - column: { name: location,       type: varchar(200) }
              - column: { name: owner,          type: varchar(120),    constraints: { nullable: false } }
              - column: { name: notes,          type: varchar(4000) }
              - column: { name: version,        type: bigint,          defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: created_at,     type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: created_by,     type: varchar(120),    constraints: { nullable: false } }
              - column: { name: updated_at,     type: timestamp with time zone, constraints: { nullable: false } }
              - column: { name: updated_by,     type: varchar(120),    constraints: { nullable: false } }
              - column: { name: archived_at,    type: timestamp with time zone }
        - sql:
            comment: Status is a closed set; a check constraint keeps bad data out even from ad-hoc SQL.
            sql: ALTER TABLE asset ADD CONSTRAINT ck_asset_status CHECK (status IN ('ACTIVE','IN_REPAIR','RETIRED','ARCHIVED'))
        - sql:
            comment: Money is never negative; currency is a 3-letter ISO code when a price exists.
            sql: ALTER TABLE asset ADD CONSTRAINT ck_asset_price CHECK (purchase_price IS NULL OR purchase_price >= 0), ADD CONSTRAINT ck_asset_currency CHECK (currency IS NULL OR currency ~ '^[A-Z]{3}$')
        - sql:
            comment: An asset tag is unique per owner (two people may both label something "LAPTOP-1"); NULL tags are allowed.
            sql: CREATE UNIQUE INDEX uq_asset_owner_tag ON asset (owner, asset_tag) WHERE asset_tag IS NOT NULL
        - createIndex:
            indexName: ix_asset_owner_status_updated
            tableName: asset
            columns:
              - column: { name: owner }
              - column: { name: status }
              - column: { name: updated_at, descending: true }
      rollback:
        - dropTable: { tableName: asset }
  - changeSet:
      id: 002-asset-index-comments
      author: janaka
      dbms: postgresql
      comment: Index reasons live next to the index so EXPLAIN readers know what each serves.
      changes:
        - sql:
            sql: |
              COMMENT ON INDEX ix_asset_owner_status_updated IS 'Serves GET /api/v1/assets: list by owner, hide archived, newest first (the default sort).';
              COMMENT ON INDEX uq_asset_owner_tag IS 'Uniqueness of asset_tag per owner; also serves lookup by tag.';
      rollback:
        - empty
