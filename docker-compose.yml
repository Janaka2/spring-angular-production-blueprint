# Local development dependencies for AssetCare.
#
#   docker compose up -d          PostgreSQL 18, Keycloak 26 (realm imported), MinIO
#   docker compose down -v        stop and wipe local data
#
# Credentials here are DEVELOPMENT ONLY and are duplicated in .env.example on purpose so they are obvious.
# Nothing in this file is used in Kubernetes; see deploy/helm.

name: assetcare

services:
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: assetcare-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assetcare}
      POSTGRES_USER: ${POSTGRES_USER:-assetcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assetcare-dev-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assetcare} -d ${POSTGRES_DB:-assetcare}"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: assetcare-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev-password}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8081"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8081"
      - "9000:9000"   # management interface: /health/ready
    volumes:
      - ./deploy/docker/keycloak/assetcare-realm.json:/opt/keycloak/data/import/assetcare-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: assetcare-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-assetcare}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-assetcare-dev-password}
    ports:
      - "${MINIO_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # one-shot: create the attachments bucket, then exit
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-assetcare} ${MINIO_ROOT_PASSWORD:-assetcare-dev-password} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-assetcare-attachments} &&
      echo 'bucket ready'
      "

volumes:
  postgres-data:
  minio-data:
