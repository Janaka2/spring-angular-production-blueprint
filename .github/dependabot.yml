# Dependency updates, grouped so a week's worth of bumps is one PR per ecosystem. The CI pipeline (Testcontainers,
# ArchUnit, Playwright, scans) is the gate; nothing merges on green alone without a look at the changelog.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Zurich }
    groups:
      spring: { patterns: ["org.springframework*", "io.micrometer*"] }
      build-and-test: { patterns: ["org.apache.maven*", "org.junit*", "org.testcontainers*", "com.tngtech*"] }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Zurich }
    groups:
      angular: { patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint", "typescript"] }
      tooling: { patterns: ["eslint*", "prettier", "vitest", "@playwright/*", "@types/*"] }
    ignore:
      # Angular 22.1 (compiler-cli, build) accepts typescript >=6.0 <6.1 and vitest ^4. A group PR that moves
      # either breaks the build or the test runner; lift these when Angular 22.2 is stable.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directories: [/infra/hetzner, /infra/oci]
    schedule: { interval: monthly }
