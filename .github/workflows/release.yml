# Release: a tag vX.Y.Z on main publishes both images for linux/amd64 and linux/arm64 to GHCR, scanned, with an SBOM,
# a cosign keyless signature and build provenance, and a GitHub release carrying the Helm chart and the SBOMs.
# Each architecture builds natively on its own runner (no QEMU), then one manifest list joins them.
# Tags are the version and sha-<commit>; "latest" is never published (docs/operations/DEPLOYMENT.md).
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      registry: ${{ steps.v.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: v
        name: Tag is on main, and the chart says the same version
        run: |
          version="${GITHUB_REF_NAME#v}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          chart=$(awk '/^version:/ {print $2}' deploy/helm/assetcare/Chart.yaml)
          app=$(awk -F'"' '/^appVersion:/ {print $2}' deploy/helm/assetcare/Chart.yaml)
          tag=$(awk -F'"' '/^  tag:/ {print $2; exit}' deploy/helm/assetcare/values.yaml)
          for pair in "Chart.yaml version:$chart" "Chart.yaml appVersion:$app" "values.yaml image.tag:$tag"; do
            test "${pair##*:}" = "$version" || { echo "::error::${pair%:*} is ${pair##*:}, the tag says $version (release skill, step 2)"; exit 1; }
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.image }} (${{ matrix.arch }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [api, frontend]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: api
            context: backend
          - image: frontend
            context: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.verify.outputs.registry }}/assetcare-${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=assetcare-${{ matrix.image }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
      - id: build
        name: Build and push by digest
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ needs.verify.outputs.registry }}/assetcare-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max
      - name: Record the digest
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    name: publish ${{ matrix.image }} (manifest, scan, SBOM, signature)
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing and provenance through GitHub OIDC
      attestations: write
    strategy:
      matrix:
        image: [api, frontend]
    env:
      REPO: ${{ needs.verify.outputs.registry }}/assetcare-${{ matrix.image }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.image }}-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: manifest
        name: One multi-arch manifest, tagged with the version and the commit
        working-directory: digests
        run: |
          refs=()
          for d in *; do refs+=("$REPO@sha256:$d"); done
          docker buildx imagetools create -t "$REPO:$VERSION" -t "$REPO:sha-${GITHUB_SHA::7}" "${refs[@]}"
          digest=$(docker buildx imagetools inspect "$REPO:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          docker buildx imagetools inspect "$REPO:$VERSION"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Trivy (fails on a fixable critical vulnerability)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REPO }}@${{ steps.manifest.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REPO }}@${{ steps.manifest.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom-assetcare-${{ matrix.image }}-${{ env.VERSION }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image and attach the SBOM as a signed attestation
        run: |
          cosign sign --yes "$REPO@${{ steps.manifest.outputs.digest }}"
          cosign attest --yes --type cyclonedx --predicate "sbom-assetcare-${{ matrix.image }}-$VERSION.cdx.json" \
            "$REPO@${{ steps.manifest.outputs.digest }}"
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REPO }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-assetcare-${{ matrix.image }}-${{ env.VERSION }}.cdx.json
          retention-days: 7

  github-release:
    name: GitHub release with the chart and SBOMs
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Package the chart
        run: helm package deploy/helm/assetcare --version "${{ needs.verify.outputs.version }}" --app-version "${{ needs.verify.outputs.version }}" -d dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sbom-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: AssetCare ${{ needs.verify.outputs.version }}
          generate_release_notes: true
          files: dist/*
          body: |
            Images (linux/amd64, linux/arm64), signed with cosign (keyless, GitHub OIDC):
            - `${{ needs.verify.outputs.registry }}/assetcare-api:${{ needs.verify.outputs.version }}`
            - `${{ needs.verify.outputs.registry }}/assetcare-frontend:${{ needs.verify.outputs.version }}`

            Verify before deploying:
            ```
            cosign verify --certificate-identity-regexp 'github.com/${{ github.repository }}/' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              ${{ needs.verify.outputs.registry }}/assetcare-api:${{ needs.verify.outputs.version }}
            ```
            Deploy: `helm upgrade --install assetcare assetcare-${{ needs.verify.outputs.version }}.tgz --set image.tag=${{ needs.verify.outputs.version }} --wait` (docs/operations/DEPLOYMENT.md).
