# Cache policy by path. Only Angular's content-hashed output (main-XXXXXXXX.js, chunk-..., styles-...) is immutable;
# icons and the manifest keep their names, so they are cached for a day; index.html and config.json never.
map $uri $cache_control {
    "~-[A-Za-z0-9_-]{8}\.(js|css)$"            "public, max-age=31536000, immutable";
    "~*\.(png|svg|ico|webmanifest|woff2?)$"    "public, max-age=86400";
    default                                    "no-store";
}

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Every header is set here, once. nginx drops all inherited add_header lines in a location that has its own
    # add_header, so locations below must not add headers; the cache policy comes from the map above.
    # The CSP allows the app's own origin, Google Fonts, and connections to the API and Keycloak.
    add_header Cache-Control $cache_control;  # success responses only; a 404 must not be cached for a year
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ${CSP_CONNECT_SRC}; frame-ancestors 'none'; base-uri 'self'; form-action 'self' ${CSP_FORM_ACTION}" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # static files that exist are served; a missing hashed asset is a 404, not the app
    location ~* \.(js|css|woff2?|png|svg|ico|webmanifest)$ {
        try_files $uri =404;
    }

    # SPA routing: every unknown path is the app
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
