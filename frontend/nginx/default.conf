server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # security headers; the CSP allows the app's own origin, Google Fonts, and connections to the API and Keycloak
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ${CSP_CONNECT_SRC}; frame-ancestors 'none'; base-uri 'self'; form-action 'self' ${CSP_FORM_ACTION}" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # hashed build output is immutable; index.html and config.json must never be cached
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /config.json { add_header Cache-Control "no-store"; }
    location = /index.html  { add_header Cache-Control "no-store"; }

    # SPA routing: every unknown path is the app
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz { access_log off; return 200 "ok"; add_header Content-Type text/plain; }
}
