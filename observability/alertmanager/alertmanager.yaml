# Alertmanager: who is told, how fast, and which alerts are silenced by a bigger one.
# Local profile. The same routes live in deploy/helm/observability/kube-prometheus-stack.yaml (alertmanager.config).
global:
  resolve_timeout: 5m
  # email: fill these and use the "email" receiver below
  # smtp_smarthost: smtp.example.com:587
  # smtp_from: alertmanager@example.com
  # smtp_auth_username: alertmanager@example.com
  # smtp_auth_password_file: /etc/alertmanager/smtp-password     # mounted secret, never in Git

route:
  receiver: webhook
  group_by: [alertname, service]
  group_wait: 30s          # collect related alerts before the first notification
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: webhook
      repeat_interval: 1h
    - matchers: [severity="warning"]
      receiver: webhook
      active_time_intervals: [working-hours]

time_intervals:
  - name: working-hours
    time_intervals:
      - weekdays: ["monday:friday"]
        times: [{ start_time: "08:00", end_time: "18:00" }]
        location: Europe/Zurich

receivers:
  - name: webhook
    # any HTTPS endpoint that accepts JSON: ntfy (https://ntfy.sh/<topic>), a Slack incoming webhook via a small relay,
    # Microsoft Teams, PagerDuty's Events API, or a local `nc -l 9095` while testing. Replace the URL.
    webhook_configs:
      - url: http://host.docker.internal:9095/alerts
        send_resolved: true
  - name: email
    email_configs:
      - to: oncall@example.com
        send_resolved: true

inhibit_rules:
  # one outage, one page: when the API is down, do not also page about its latency, errors or dependencies
  - source_matchers: [alertname="AssetCareApiDown"]
    target_matchers: [alertname=~"AssetCareHigh5xxRate|AssetCareP95LatencyHigh|AssetCareDependencyDown|AssetCareDbPoolNearlyExhausted"]
    equal: [service]
  - source_matchers: [alertname="AssetCareEndpointDown"]
    target_matchers: [alertname="AssetCareApiDown"]
