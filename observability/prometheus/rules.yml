# Alert rules. Each threshold has its reason next to it; a rule without a reason is noise waiting to happen.
groups:
  - name: assetcare-api
    rules:
      - alert: AssetCareApiDown
        expr: up{job="assetcare-api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "AssetCare API is not being scraped"
          description: "No metrics for 2 minutes. Two minutes rides out a rolling restart; longer is an outage."

      - alert: AssetCareHigh5xxRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="assetcare-api", status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count{job="assetcare-api"}[5m])) > 0.02
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "More than 2% of requests fail with 5xx"
          description: "5xx are our bugs or our dependencies. 2% over 5 minutes is well above the noise of a single bad request and well below users giving up."

      - alert: AssetCareP95LatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job="assetcare-api", uri!~"/actuator.*"}[5m]))) > 0.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "p95 latency above 500 ms for 10 minutes"
          description: "The k6 reference SLO is 300 to 400 ms for list and search; 500 ms sustained means the database or the pool is the bottleneck. See SCALING.md."

      - alert: AssetCareDbPoolNearlyExhausted
        expr: hikaricp_connections_active{job="assetcare-api"} / hikaricp_connections_max{job="assetcare-api"} > 0.85
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Hikari pool above 85% for 5 minutes"
          description: "Requests will start waiting for connections (hikaricp_connections_pending). Add replicas or raise the pool within PostgreSQL's max_connections."

      - alert: AssetCareDbConnectionsPending
        expr: hikaricp_connections_pending{job="assetcare-api"} > 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Threads are waiting for a database connection"

      - alert: AssetCareJvmHeapHigh
        expr: sum(jvm_memory_used_bytes{job="assetcare-api", area="heap"}) / sum(jvm_memory_max_bytes{job="assetcare-api", area="heap"}) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "JVM heap above 90% for 10 minutes"
          description: "Sustained, not a GC cycle. Check for a leak in a trace; raise the container limit only with a reason."

  - name: kubernetes
    rules:
      - alert: AssetCarePodRestarting
        expr: increase(kube_pod_container_status_restarts_total{namespace="assetcare"}[30m]) > 3
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "A pod restarted more than 3 times in 30 minutes"
          description: "Crash loop or failing liveness probe. kubectl describe pod and the last logs (RUNBOOK.md)."

      - alert: AssetCareVolumeNearlyFull
        expr: kubelet_volume_stats_available_bytes{namespace="assetcare"} / kubelet_volume_stats_capacity_bytes{namespace="assetcare"} < 0.1
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "A persistent volume has less than 10% free"
          description: "PostgreSQL stops accepting writes when its disk is full. Expand the volume or prune backups."
